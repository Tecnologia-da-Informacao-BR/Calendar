spring.datasource.url=jdbc:postgresql://localhost:5433/calendar
spring.datasource.username=calendar
spring.datasource.password=calendar

secret.password.pepper=test-pepper-value
jwt.secret=test-only-jwt-secret-not-for-production-use-0123456789

# No real mail server in tests. Point at localhost on a port nothing listens
# on so send() fails fast (connection refused) instead of hanging/timing out
# against a real network. EmailService swallows the failure and logs it.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test-password