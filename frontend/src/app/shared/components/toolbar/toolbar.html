<header class="flex items-center justify-between px-6 py-3 bg-white border-b border-gray-200">
  <!-- Search input -->
  <div class="flex items-center px-4 py-2 border border-gray-300 rounded-full w-64 bg-white">
    <app-icon name="search" [size]="16" class="text-gray-400 mr-2 shrink-0" />
    <input
      type="text"
      placeholder="Buscar eventos..."
      class="bg-transparent border-none outline-none text-sm text-gray-600 placeholder-gray-400 w-full"
    />
  </div>

  <!-- Center: view toggle + navigation + date label -->
  <div class="flex items-center space-x-5">
    <!-- View toggle buttons -->
    <div class="flex items-center space-x-5 text-sm font-medium">
      <button class="text-gray-900 border-b-2 border-blue-600 pb-0.5">Mês</button>
      <button class="text-gray-500 hover:text-gray-900">Semana</button>
      <button class="text-gray-500 hover:text-gray-900">Dia</button>
    </div>

    <!-- Previous arrow -->
    <button
      type="button"
      aria-label="Período anterior"
      class="text-gray-500 hover:text-gray-800 transition-colors"
    >
      <app-icon name="chevron-left" [size]="16" />
    </button>

    <!-- Today button -->
    <button
      class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-1.5 rounded-full transition-colors"
    >
      Hoje
    </button>

    <!-- Next arrow -->
    <button
      type="button"
      aria-label="Próximo período"
      class="text-gray-500 hover:text-gray-800 transition-colors"
    >
      <app-icon name="chevron-right" [size]="16" />
    </button>

    <!-- Current month/year label -->
    <span class="text-sm font-bold text-gray-900">Outubro 2026</span>
  </div>

  <!-- Right side: icons -->
  <div class="flex items-center space-x-3">
    <!-- Vertical divider -->
    <div class="w-px h-5 bg-gray-300"></div>

    <button
      type="button"
      aria-label="Notificações"
      class="text-gray-500 hover:text-gray-800 transition-colors"
    >
      <app-icon name="bell" [size]="20" />
    </button>

    <button
      type="button"
      aria-label="Calendário"
      class="text-gray-500 hover:text-gray-800 transition-colors"
    >
      <app-icon name="calendar" [size]="20" />
    </button>
  </div>
</header>
